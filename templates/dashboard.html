<!DOCTYPE html>
<html>
<head>
    <title>Analytics Dashboard</title>
</head>
<body>

<h1>📊 Detection Analytics</h1>

<table border="1" cellpadding="10">

<tr>
    <th>Animal</th>
    <th>Confidence</th>
    <th>Time</th>
</tr>

{% for item in data %}
<tr>
    <td>{{ item[1] }}</td>
    <td>{{ item[2] }}%</td>
    <td>{{ item[4] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
